<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eaf1ff" />
    <meta name="description" content="登录辰思AI内容创作与账号管理工作台" />
    <title>登录 · 辰思AI</title>
    <link rel="icon" type="image/png" href="/assets/brand/chensi-mark-blue.png" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/admin.css" />
    <link rel="stylesheet" href="/liquid-glass.css" />
    <link rel="stylesheet" href="/liquid-system.css" />
    <link rel="stylesheet" href="/admin-liquid.css" />
    <link rel="stylesheet" href="/liquid-overhaul.css" />
    <link rel="stylesheet" href="/optical-glass.css?v=20260830-switch-shell2" />
    <link rel="stylesheet" href="/light-liquid-overhaul.css?v=20260829-light36" />
    <link rel="stylesheet" href="/login-overrides.css?v=20260911-logo-home1" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-brand">
        <a class="auth-brand-home" href="/" aria-label="返回辰思AI首页">
          <img class="auth-brand-logo" src="/assets/brand/chensi-logo-white.png" alt="辰思AI" width="960" height="430" />
        </a>
        <div class="section-kicker">会用工具，用“好”工具</div>
        <h1 class="sr-only">辰思AI</h1>
        <p>内容创作、账号发布与运营后台使用同一套账号和数据</p>
        <div class="auth-status"><span class="status-dot ok"></span>本地安全会话</div>
      </section>
      <section class="auth-form-panel">
        <div class="section-kicker" id="authKicker">ACCOUNT ACCESS</div>
        <h2 id="authTitle">登录工作台</h2>
        <p class="auth-hint" id="authHint">使用管理员创建的账号登录</p>
        <form id="authForm">
          <label class="field setup-only hidden"><span>管理员姓名</span><input id="displayNameInput" name="displayName" autocomplete="name" placeholder="用于后台展示" /></label>
          <label class="field"><span>账号</span><input id="accountInput" name="username" autocomplete="username" required placeholder="邮箱、手机号或自定义账号" /></label>
          <label class="field"><span>密码</span><input id="passwordInput" name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="至少 8 位" /></label>
          <button class="primary-button full" id="authButton" type="submit">登录</button>
        </form>
        <div class="auth-error" id="authError" role="alert"></div>
      </section>
    </main>
    <script src="/runtime-config.js"></script>
    <script src="/optical-glass.js?v=20260830-switch-shell2" type="module"></script>
    <script src="/liquid-glass.js?v=20260827-lit-rim2" type="module"></script>
    <script src="/login.js" type="module"></script>
    <script src="/vendor/gsap.min.js"></script>
    <script src="/liquid-motion.js?v=20260828-colour-flow1"></script>
  </body>
</html>
