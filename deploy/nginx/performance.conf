# Static application assets are versioned by the Web server and can be cached
# for a year. Unversioned assets keep their conservative response headers.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/xml
  image/svg+xml;
